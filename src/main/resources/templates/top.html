<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin - Top</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: linear-gradient(135deg, #2c2f4a, #4b3b4f);
      color: #fff;
    }

    .wrap {
      width: min(1100px, 92vw);
      margin: 40px auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      margin: 0;
      letter-spacing: .5px;
    }

    .meta {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      margin-top: 6px;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.9; }

    .btn-primary {
      background: #2ecc71;
      border-color: transparent;
      font-weight: 700;
    }

    .btn-danger {
      background: #e74c3c;
      border-color: transparent;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }

    .menu-card {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      padding: 16px;
    }

    .menu-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: .3px;
    }

    .menu-desc {
      margin: 0 0 12px;
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      line-height: 1.5;
    }

    .menu-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
	
	.notice{
	  margin-top: 12px;
	  border-radius: 12px;
	  padding: 12px 14px;
	  border: 1px solid rgba(46, 204, 113, 0.55);
	  background: rgba(46, 204, 113, 0.14);
	  color: rgba(255,255,255,0.95);
	  font-size: 13px;
	  line-height: 1.5;
	}

  </style>
</head>

<body>
<div class="notice"
    th:if="${flashMessage != null}"
    th:text="${flashMessage}">
</div>

<div class="wrap">
  <div class="card">

    <div class="topbar">
      <div>
        <h1>管理者メニュー</h1>
        <div class="meta">
          ログイン中：
          <span th:text="${session.loginUser != null ? session.loginUser.name : '未ログイン'}"></span>
          （<span th:text="${session.loginUser != null ? session.loginUser.role : '-'}"></span>）
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="/logout">ログアウト</a>
      </div>
    </div>

    <div class="grid">
      <!-- 申請一覧 -->
      <div class="menu-card">
        <p class="menu-title">申請一覧</p>
        <p class="menu-desc">交通費申請の一覧確認、検索、承認／却下を行います。</p>
        <div class="menu-actions">
          <a class="btn btn-primary" href="/adminTravelCost">申請一覧へ</a>
        </div>
      </div>

      <!-- ユーザー登録 -->
      <div class="menu-card">
        <p class="menu-title">ユーザー登録</p>
        <p class="menu-desc">社員アカウントを追加します（ADMINのみ操作可能）。</p>
        <div class="menu-actions">
          <a class="btn btn-primary" href="/admin/users/new">新規登録へ</a>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
