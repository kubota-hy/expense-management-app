<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign in</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: linear-gradient(135deg, #2c2f4a, #4b3b4f);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .login-card {
      width: 360px;
      padding: 32px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    .login-card h1 {
      text-align: center;
      font-weight: 400;
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .field {
      margin-bottom: 18px;
      position: relative;
    }

    .field input {
      width: 100%;
      padding: 12px 12px;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .field input::placeholder {
      color: rgba(255,255,255,0.5);
    }

    .login-btn {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: #2ecc71;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .error {
      margin-top: 16px;
      text-align: center;
      color: #ff6b6b;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="login-card">
  <h1>Sign in</h1>

  <form action="/login" method="post">
    <div class="field">
      <input type="email" name="email" placeholder="Username or email" required>
    </div>

    <div class="field">
      <input type="password" name="password" placeholder="Password" required>
    </div>

    <button class="login-btn" type="submit">Login</button>
  </form>

  <div class="error" th:text="${error}"></div>
</div>

</body>
</html>
