<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>申請一覧（管理者）</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: linear-gradient(135deg, #2c2f4a, #4b3b4f);
      color: #fff;
    }

    .wrap {
      width: min(1100px, 92vw);
      margin: 40px auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      padding: 22px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }

    .btn-primary {
      background: #2ecc71;
      border-color: transparent;
      font-weight: 700;
    }

    .btn-danger {
      background: #e74c3c;
      border-color: transparent;
      font-weight: 700;
    }

    .search {
      margin-top: 12px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
    }

    .search-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 160px;
    }

    .field label {
      font-size: 12px;
      color: rgba(255,255,255,0.75);
    }

    .input {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.12);
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 13px;
    }

    thead th {
      padding: 12px 10px;
      background: rgba(255,255,255,0.10);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      text-align: left;
    }

    tbody td {
      padding: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .status {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .empty {
      margin-top: 14px;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>

<body>
<div class="wrap">
  <div class="card">

    
    <div class="topbar">
      <div>
        <h1>申請一覧（管理者）</h1>
        <div style="font-size:13px; color:rgba(255,255,255,.7)">
          表示件数：
          <span th:text="${expenseList != null ? expenseList.size() : 0}"></span>
        </div>
      </div>

      <div class="actions">
        <a class="btn" href="/travelCost">USER画面へ</a>
        <a class="btn btn-primary" href="/logout">ログアウト</a>
      </div>
    </div>

   
    <div class="search">
      <form th:action="@{/adminTravelCost/search}"
            th:object="${searchForm}"
            method="post">

        <div class="search-row">

          <div class="field">
            <label>申請日（From）</label>
            <input type="date" class="input" th:field="*{submittedFrom}">
          </div>

          <div class="field">
            <label>申請日（To）</label>
            <input type="date" class="input" th:field="*{submittedTo}">
          </div>

          <div class="field">
            <label>申請者名</label>
            <input type="text" class="input"
                   th:field="*{userName}"
                   placeholder="例：山田">
          </div>

          <div class="field">
            <label>ステータス</label>
            <select class="input" th:field="*{status}">
              <option value="">全て</option>
              <option value="SUBMITTED">SUBMITTED</option>
              <option value="APPROVED">APPROVED</option>
              <option value="REJECTED">REJECTED</option>
            </select>
          </div>

          <div class="field">
            <label>区分</label>
            <select class="input" th:field="*{claimType}">
              <option value="">全て</option>
              <option value="交通費">交通費</option>
              <option value="その他">その他</option>
            </select>
          </div>

          <div class="field">
            <button class="btn btn-primary" type="submit">検索</button>
            <a class="btn" th:href="@{/adminTravelCost}">クリア</a>
          </div>

        </div>
      </form>
    </div>

    
    <div th:if="${expenseList != null and !expenseList.isEmpty()}">
      <table>
        <thead>
        <tr>
          <th>申請日時</th>
          <th>利用日</th>
          <th>区分</th>
          <th>金額</th>
          <th>目的</th>
          <th>ステータス</th>
          <th>ユーザID</th>
          <th>操作</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="e : ${expenseList}">
          <td th:text="${e.submittedAt}"></td>
          <td th:text="${e.useDate}"></td>
          <td th:text="${e.claimType}"></td>
          <td th:text="${e.amount}"></td>
          <td th:text="${e.purpose}"></td>
          <td><span class="status" th:text="${e.status}"></span></td>
          <td th:text="${e.userId}"></td>

          <td>
            <div th:if="${e.status == 'SUBMITTED'}" style="display:flex; gap:6px;">
              <form th:action="@{/admin/expenses/{id}/approve(id=${e.id})}"
                    method="post">
                <button class="btn btn-primary" type="submit">承認</button>
              </form>

              <form th:action="@{/admin/expenses/{id}/reject(id=${e.id})}"
                    method="post">
                <button class="btn btn-danger" type="submit">却下</button>
              </form>
            </div>
            <span th:if="${e.status != 'SUBMITTED'}">-</span>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <div class="empty"
         th:if="${expenseList == null or expenseList.isEmpty()}">
      申請データがありません。
    </div>

  </div>
</div>
</body>
</html>
