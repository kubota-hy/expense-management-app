<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>交通費申請</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
      background: linear-gradient(135deg, #2c2f4a, #4b3b4f);
      color: #fff;
    }

    a { color: rgba(255,255,255,0.9); text-decoration: none; }
    a:hover { opacity: 0.9; }

    .wrap {
      width: min(980px, 92vw);
      margin: 30px auto;
      display: grid;
      gap: 22px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      padding: 22px;
    }

    .topline {
      display:flex;
      justify-content: space-between;
      align-items:center;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: .5px;
    }

    .meta {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      white-space: nowrap;
    }

    .row { display: flex; gap: 20px; margin: 14px 0; align-items: center; }
    .label { width: 160px; font-weight: 700; color: rgba(255,255,255,0.9); }
    .req { color: #ff6b6b; font-weight: 800; margin-left: 6px; }
    .ctrl { flex: 1; }

    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      width: 100%;
      padding: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255,255,255,0.55);
    }

    textarea { height: 110px; resize: vertical; }

    select option { color: #111; } /* 一部ブラウザ対策 */

    .radios { display:flex; gap: 30px; align-items:center; }
    .radios label { color: rgba(255,255,255,0.9); }

    .err {
      color: #ff6b6b;
      font-size: 13px;
      margin-top: 6px;
    }

    .actions {
      display:flex;
      justify-content: space-between;
      align-items:center;
      margin-top: 6px;
    }

    .btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
    }

    .btn-primary { background: #2ecc71; color: #fff; }
    .btn-primary:hover { opacity: 0.92; }

    .btn-ghost {
      background: rgba(255,255,255,0.06);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      text-decoration: none;
      display: inline-block;
    }

    .btn-ghost:hover { opacity: 0.92; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
    th, td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.12); vertical-align: top; }
    th { text-align: left; color: rgba(255,255,255,0.8); background: rgba(255,255,255,0.08); }
    tr:hover { background: rgba(255,255,255,0.05); }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      white-space: nowrap;
    }

    .table-wrap { overflow-x: auto; }

    /* 画面が狭い時は縦並び */
    @media (max-width: 720px) {
      .row { flex-direction: column; align-items: stretch; gap: 8px; }
      .label { width: auto; }
      .radios { gap: 18px; }
      .topline { flex-direction: column; align-items: flex-start; }
      .actions { flex-direction: column; gap: 10px; align-items: stretch; }
    }
  </style>
</head>

<body>

<div class="wrap">

  <!-- 申請フォームカード -->
  <div class="card">

    <div class="topline">
      <h2>交通費申請</h2>
      <div class="meta">
        申請日　
        <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy/MM/dd')}"></span>
      </div>
    </div>

    <form th:action="@{/travelCost}" th:object="${expenseForm}" method="post">

      <!-- 利用日 -->
      <div class="row">
        <div class="label">利用日<span class="req">(必須)</span></div>
        <div class="ctrl">
          <input type="date" th:field="*{useDate}">
          <div class="err" th:errors="*{useDate}"></div>
        </div>
      </div>

      <!-- 請求区分 -->
      <div class="row">
        <div class="label">請求区分<span class="req">(必須)</span></div>
        <div class="ctrl radios">
          <label><input type="radio" th:field="*{claimType}" value="交通費"> 交通費</label>
          <label><input type="radio" th:field="*{claimType}" value="その他"> その他</label>
        </div>
      </div>
      <div class="err" th:errors="*{claimType}"></div>

      <!-- 交通手段 -->
      <div class="row">
        <div class="label">交通手段<span class="req">(必須)</span></div>
        <div class="ctrl">
          <select th:field="*{transportation}">
            <option value="">選択してください</option>
            <option value="電車">電車</option>
            <option value="バス">バス</option>
            <option value="タクシー">タクシー</option>
            <option value="徒歩">徒歩</option>
            <option value="その他">その他</option>
          </select>
          <div class="err" th:errors="*{transportation}"></div>
        </div>
      </div>

      <!-- 出発地 -->
      <div class="row">
        <div class="label">出発地<span class="req">(必須)</span></div>
        <div class="ctrl">
          <input type="text" th:field="*{fromPlace}" placeholder="出発地を入力してください">
          <div class="err" th:errors="*{fromPlace}"></div>
        </div>
      </div>

      <!-- 到着地 -->
      <div class="row">
        <div class="label">到着地<span class="req">(必須)</span></div>
        <div class="ctrl">
          <input type="text" th:field="*{toPlace}" placeholder="到着地を入力してください">
          <div class="err" th:errors="*{toPlace}"></div>
        </div>
      </div>

      <!-- 片・往 -->
      <div class="row">
        <div class="label">片・往<span class="req">(必須)</span></div>
        <div class="ctrl radios">
          <label><input type="radio" th:field="*{tripType}" value="片道"> 片道</label>
          <label><input type="radio" th:field="*{tripType}" value="往復"> 往復</label>
        </div>
      </div>
      <div class="err" th:errors="*{tripType}"></div>

      <!-- 金額 -->
      <div class="row">
        <div class="label">金額<span class="req">(必須)</span></div>
        <div class="ctrl">
          <input type="number" th:field="*{amount}" placeholder="金額を入力してください">
          <div class="err" th:errors="*{amount}"></div>
        </div>
      </div>

      <!-- 請求目的 -->
      <div class="row">
        <div class="label">請求目的<span class="req">(必須)</span></div>
        <div class="ctrl">
          <input type="text" th:field="*{purpose}" placeholder="請求目的を入力してください">
          <div class="err" th:errors="*{purpose}"></div>
        </div>
      </div>

      <!-- 備考 -->
      <div class="row">
        <div class="label">備考</div>
        <div class="ctrl">
          <textarea th:field="*{note}" placeholder="任意"></textarea>
          <div class="err" th:errors="*{note}"></div>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-ghost" href="/logout">ログアウト</a>
        <button class="btn btn-primary" type="submit">申請</button>
      </div>

    </form>

  </div>

  <!-- 一覧カード -->
  <div class="card">
    <div class="topline" style="margin-bottom: 6px;">
      <h2 style="font-size:18px;">申請一覧</h2>
      <div class="meta">自分の申請履歴</div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>利用日</th>
          <th>区分</th>
          <th>交通手段</th>
          <th>出発</th>
          <th>到着</th>
          <th>片/往</th>
          <th>金額</th>
          <th>目的</th>
          <th>備考</th>
          <th>ステータス</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="e : ${expenseList}">
          <td th:text="${e.useDate}"></td>
          <td th:text="${e.claimType}"></td>
          <td th:text="${e.transportation}"></td>
          <td th:text="${e.fromPlace}"></td>
          <td th:text="${e.toPlace}"></td>
          <td th:text="${e.tripType}"></td>
          <td th:text="${e.amount}"></td>
          <td th:text="${e.purpose}"></td>
          <td th:text="${e.note}"></td>
          <td><span class="status" th:text="${e.status}"></span></td>
        </tr>
        </tbody>
      </table>
    </div>

    <div th:if="${expenseList == null or expenseList.isEmpty()}" style="color: rgba(255,255,255,0.75); margin-top: 10px;">
      まだ申請はありません。
    </div>
  </div>

</div>
</body>
</html>
